packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@sanity/diff@6.9.2'
  - '@sanity/mutator@6.9.2'
  - '@sanity/presentation-comlink@2.2.3'
  - '@sanity/preview-url-secret@4.1.3'
  - '@sanity/preview-url-secret@4.1.4'
  - '@sanity/schema@6.9.2'
  - '@sanity/types@6.9.2'
  - '@sanity/ui@4.0.1'
  - '@sanity/util@6.9.2'
  - '@sanity/visual-editing-csm@3.0.15'
  - '@sanity/visual-editing-types@2.0.13'
  - '@sanity/visual-editing-types@2.0.14'
  - '@sanity/visual-editing@6.0.1'
  - groq@6.9.2
  - next-sanity@13.3.2
  - sanity@6.9.2
  - styled-components@6.5.2

onlyBuiltDependencies:
  - "@sentry/cli"
  - "esbuild"
  - "sharp"
  - "unrs-resolver"
